<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="page-title">Search — PillScope</title>
<meta name="description" content="Search results for a medicine on PillScope." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/home/" class="logo">PillScope<span class="dot"></span></a>
    <nav class="site-nav">
      <a href="/home/">Home</a>
      <a href="/about/">About</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 id="search-heading">Search results</h1>
      <p class="lead" id="search-sub">Refine your search below.</p>

      <div class="search-shell">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input
            id="search-input"
            type="text"
            placeholder="Search Ibuprofen, allergy, metformin…"
            autocomplete="off"
            aria-label="Search medicines"
          />
          <button id="search-clear" class="search-clear" aria-label="Clear search">&times;</button>
        </div>
      </div>
      <p style="margin-top:10px;"><a href="/scan/" class="btn" style="display:inline-block;">Scan a barcode</a></p>
    </div>
  </section>

  <section class="browse" id="results-section">
    <div class="wrap">
      <div id="med-grid" class="med-grid"></div>
      <div id="empty-state" class="not-found" hidden>
        <h1 id="empty-heading">No matches found</h1>
        <p>Try a different name, generic name, or category.</p>
        <a class="btn" href="/home/">Back to home</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>PillScope — for informational purposes only. Not a substitute for medical advice.</p>
    <div class="foot-links">
      <a href="/home/">Home</a>
      <a href="/about/">About</a>
    </div>
  </div>
</footer>

<script src="/pillscope-data.js"></script>
<script src="/search/search.js"></script>
</body>
</html>
